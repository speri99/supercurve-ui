<div style="padding: 1em;display: flex;justify-content: flex-end;">
    <button nz-button nzType="primary" (click)="openModal()">
        <span>Create</span>
      </button>
</div>

  <nz-table #nzTable [nzData]="incidentData" nzTableLayout="fixed">
    <thead>
      <tr>
        <th nzCustomFilter>
         Custommer Name
          <nz-filter-trigger [(nzVisible)]="visible" [nzActive]="searchValue.length > 0" [nzDropdownMenu]="menu">
            <span nz-icon nzType="search"></span>
          </nz-filter-trigger>
        </th>
        <th>Priority</th>
        <th>Store Name</th>
        <th>File Location</th>
        <th>Created Date</th>
      
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of nzTable.data">
        <td>{{ data.customerName }}</td>
        <td>{{ data.priority }}</td>
        <td>{{ data.storeName }}</td>
        <td>{{ data.fileLocation}}</td>
        <td>{{ data.createdDate | date}}</td>
       
      </tr>
    </tbody>
  </nz-table>
  <nz-dropdown-menu #menu="nzDropdownMenu">
    <div class="ant-table-filter-dropdown">
      <div class="search-box">
        <input type="text" nz-input placeholder="Search name" [(ngModel)]="searchValue" />
        <button nz-button nzSize="small" nzType="primary" (click)="search()" class="search-button">Search</button>
        <button nz-button nzSize="small" (click)="reset()">Reset</button>
      </div>
    </div>
  </nz-dropdown-menu>

  <nz-modal
  [(nzVisible)]="isVisible"
  nzTitle="Create Incident"
  [nzFooter]="null"
  (nzOnCancel)="closeModal()"
>

 
  <ng-container *nzModalContent>
    <nz-spin [nzSpinning]="isSpinning" [nzDelay]="500">
    <form [formGroup]="incidentForm" (ngSubmit)="onSubmit()">
       
          <div nz-col nzSpan="12">
            <label>Customer Name</label>
            <input nz-input formControlName="customerName" placeholder="Enter Customer Name" />
          </div>
          <div nz-col nzSpan="12">
            <label>Store Name</label>
            <input nz-input formControlName="storeName" placeholder="Enter Store Name" />
          </div>
       
    
       
          <div nz-col nzSpan="12">
            <label>Camera Name</label>
            <input nz-input formControlName="cameraName" placeholder="Enter Camera Name" />
          </div>
          <div nz-col nzSpan="12">
            <label>Incident Type</label>
            <nz-select formControlName="incidentType" nzPlaceHolder="Select Incident Type">
              <nz-option nzValue="hardware" nzLabel="Hardware Issue"></nz-option>
              <nz-option nzValue="software" nzLabel="Software Issue"></nz-option>
              <nz-option nzValue="other" nzLabel="Other"></nz-option>
            </nz-select>
          </div>
     
    
      
          <div nz-col nzSpan="12">
            <label>Priority</label>
            <nz-select formControlName="priority" nzPlaceHolder="Select Priority">
              <nz-option nzValue="low" nzLabel="Low"></nz-option>
              <nz-option nzValue="medium" nzLabel="Medium"></nz-option>
              <nz-option nzValue="high" nzLabel="High"></nz-option>
            </nz-select>
          </div>
          <div nz-col nzSpan="12">
            <label>Attachment</label>
            <input type="file" (change)="onFileChange($event)" />
          </div>
       
    
        <div style="margin-top: 16px; text-align: right;">
          <button nz-button nzType="default" (click)="closeModal()">Cancel</button>
          <button nz-button nzType="primary" [disabled]="incidentForm.invalid" htmlType="submit">
            Submit
          </button>
        </div>
      </form>
      </nz-spin>
</ng-container>
</nz-modal>
